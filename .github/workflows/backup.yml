# 日次バックアップ (SPEC.md §13.3)
#
# Supabase の無料枠には自動バックアップが無いため、GitHub Actions で
# 毎日 pg_dump を取り、Actions のアーティファクトとして保管する。
#
# ---- 事前設定 (1回だけ) ----
# リポジトリの Settings → Secrets and variables → Actions → New repository secret
#   名前: SUPABASE_DB_URL
#   値  : Supabase の Project Settings → Database → Connection string の
#         **Session pooler** (ポート5432) の URL。パスワードを埋めて登録する。
#
#   ポート6543 の Transaction pooler は pg_dump に使えない (下で弾いている)。
#   直結 (db.<ref>.supabase.co) も IPv6 のみで、GitHub のランナーは IPv4 のため
#   接続できず、**エラーにならず待ち続ける**。
#
# ---- 復元 ----
#   pg_restore --clean --if-exists --no-owner --no-privileges \
#     -d "$SUPABASE_DB_URL" backup.dump
#
# ---- 注意 ----
# - GitHub は「60日間リポジトリに動きが無い」とスケジュール実行を止める。
#   長期休暇明けは Actions タブで有効化されているか確認すること。
# - アーティファクトの保管は90日。それより長く残したいものは手元に落とす。
# - 手動実行もできる (Actions → 日次バックアップ → Run workflow)。

name: 日次バックアップ

on:
  schedule:
    # UTC 19:00 = JST 翌04:00。利用が最も少ない時間帯に寄せている
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    # このデータ量なら実際は1分もかからない。**待ちに入ったら早めに落とす**
    timeout-minutes: 10

    steps:
      - name: 接続先を確かめる
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # 未設定のまま緑になると「バックアップがある」と誤解するので必ず落とす
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL が設定されていません (このファイル冒頭の手順を参照)"
            exit 1
          fi

          # パスワードを出さないよう、認証情報を落としたホスト:ポートだけ表示する
          endpoint=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[a-z]+://[^@]*@##; s#[/?].*$##')
          echo "接続先: $endpoint"

          case "$endpoint" in
            *:6543)
              echo "::error::Transaction pooler (6543) は pg_dump に使えません。Session pooler (5432) のURLに差し替えてください"
              exit 1
              ;;
            db.*.supabase.co*)
              echo "::error::直結URLは IPv6 のみで GitHub のランナーからは接続できません。Session pooler (5432) のURLに差し替えてください"
              exit 1
              ;;
          esac

      # apt でクライアントを入れると対話プロンプトで止まることがあるため、
      # PostgreSQL 公式コンテナの pg_dump を使う (Docker はランナーに同梱)。
      # 17 のクライアントは 15/17 どちらのサーバーもダンプできる
      - name: ダンプを取る
        timeout-minutes: 5
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # **$DB_URL はコンテナの中で展開させる。**
          # sh -c を挟まず素で書くと、外側のシェルが先に展開して空文字になり、
          # pg_dump が接続先なしと解釈してローカルソケットを探しに行く
          # ("connection to server on socket ... failed" はこれが原因)。
          # そのため囲みは**シングルクォート**でなければならない。
          docker run --rm \
            -e DB_URL="$SUPABASE_DB_URL" \
            -e PGSSLMODE=require \
            -e PGCONNECT_TIMEOUT=15 \
            postgres:17-alpine \
            sh -c 'pg_dump --no-owner --no-privileges --format=custom "$DB_URL"' \
            > backup.dump

          # 空のファイルが上がると「バックアップがある」と誤解するので確かめる
          if [ ! -s backup.dump ]; then
            echo "::error::ダンプが空です"
            exit 1
          fi
          ls -lh backup.dump

      - name: 日付を決める
        id: stamp
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: アーティファクトに保存する
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.stamp.outputs.date }}
          path: backup.dump
          retention-days: 90
