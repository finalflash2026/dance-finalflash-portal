<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ff Calendar</title>
<!-- iOS アプリで本番を開けなかったときに出す (SPEC.md §2.3 / v1.37) -->
<style>
  :root { --bg: #22272e; --fg: #e6edf3; --muted: #9aa5b1; --accent: #f08379; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --accent: #c0392b; color-scheme: light; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Hiragino Sans", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  button { margin-top: 12px; height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; }
  button:active { opacity: .8; }
</style>
<script src="server.js"></script>
</head>
<body>
<main>
  <h1>開けませんでした</h1>
  <p>通信できる場所で、もう一度開いてください。</p>
  <button type="button" onclick="location.href = window.FF_SERVER_URL || '/'">再読み込み</button>
</main>
</body>
</html>
